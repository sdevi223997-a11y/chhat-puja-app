
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>छठ पूजा AI शुभकामना कार्ड - Built by Vivek</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #2b0900, #661d00, #1a0500);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 183, 3, 0.45);
      border-radius: 22px;
      padding: 26px 22px;
      width: 100%;
      max-width: 410px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
    }
    .sun {
      font-size: 54px;
      margin-bottom: 6px;
    }
    h1 {
      color: #ffb703;
      font-size: 24px;
      margin: 4px 0;
    }
    p.sub {
      color: #fde68a;
      font-size: 13px;
      margin-bottom: 20px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ffb703;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #fb8500;
    }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #f59e0b, #ea580c);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 4px;
    }
    .wish-box {
      display: none;
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px dashed #fbbf24;
      padding: 18px;
      border-radius: 14px;
    }
    .wish-text {
      font-size: 15px;
      line-height: 1.65;
      color: #fef3c7;
    }
    .sender {
      margin-top: 12px;
      font-weight: bold;
      color: #ffb703;
      font-size: 16px;
    }
    .wa-btn {
      background: #22c55e;
      margin-top: 14px;
    }
    .timing-box {
      margin-top: 18px;
      background: rgba(255, 183, 3, 0.12);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: #fde68a;
    }
    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sun">🌅🙏</div>
    <h1>महापर्व छठ पूजा शुभकामना</h1>
    <p class="sub">अपने नाम का खास छठ पूजा AI कार्ड बनाएं</p>
    
    <input type="text" id="userName" placeholder="यहाँ अपना नाम लिखें (जैसे: Vivek)">
    
    <select id="langSelect">
      <option value="hindi">शुद्ध हिंदी शुभकामना संदेश</option>
      <option value="bhojpuri">भोजपुरी विशेष संदेश</option>
    </select>
    
    <button onclick="makeCard()">✨ मेरा छठ कार्ड बनाएं</button>
    
    <div class="wish-box" id="wishBox">
      <div class="wish-text" id="wishMsg"></div>
      <div class="sender" id="senderName"></div>
      <button class="wa-btn" onclick="shareWA()">📲 WhatsApp पर दोस्तों को भेजें</button>
    </div>

    <div class="timing-box">
      🌞 <b>छठ पूजा 2026 शुभ मुहूर्त:</b><br>
      संध्या अर्घ्य: 15 नवंबर (शाम) | उषा अर्घ्य: 16 नवंबर (सुबह)
    </div>
    
    <div class="footer">Built by Vivek 🚀 | छठ मईया की कृपा सब पर बनी रहे</div>
  </div>

  <script>
    let finalShareText = "";
    function makeCard() {
      let name = document.getElementById('userName').value.trim() || "Vivek";
      let lang = document.getElementById('langSelect').value;
      let msg = "";
      if (lang === "bhojpuri") {
        msg = "🌅 छठ मईया के पावन पर्व पर रउआ आ रउआ पूरा परिवार के हार्दिक शुभकामना! सूर्य देव आ छठ मईया के कृपा से घर में सुख, शांति आ समृद्धि बनल रहे। जय छठी मईया! 🙏";
      } else {
        msg = "🌅 सूर्य देव की ऊर्जा और छठी मईया के आशीर्वाद से आपके जीवन में सुख, शांति, समृद्धि और नई सफलता का प्रकाश फैला रहे। महापर्व छठ पूजा की हार्दिक शुभकामनाएं! 🙏";
      }
      document.getElementById('wishMsg').innerText = msg;
      document.getElementById('senderName').innerText = "— शुभेच्छु: " + name;
      document.getElementById('wishBox').style.display = "block";
      finalShareText = msg + "\n— शुभेच्छु: " + name + "\n\n✨ अपना नाम का कार्ड यहाँ बनाएं: " + window.location.href;
    }
    function shareWA() {
      let url = "https://whatsapp.com" + encodeURIComponent(finalShareText);
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
